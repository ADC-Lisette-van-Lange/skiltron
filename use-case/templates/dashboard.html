{% extends "base.html" %}
{% block title %}Data-assistent{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h2 class="mb-1">Data-assistent</h2>
        <p class="text-muted mb-4">Stel vragen over de Schiphol-meldingsdata.</p>

        <div class="card d-flex flex-column" style="height:600px;">
            <div class="card-header d-flex align-items-center gap-2 bg-white">
                <i class="bi bi-robot text-primary fs-5"></i>
                <strong>Schiphol Signalen Assistent</strong>
            </div>
            <div id="chat-messages" style="flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;">
                <div class="chat-msg bot">Hallo! Stel een vraag over de meldingsdata.</div>
            </div>
            <div style="padding:12px; border-top:1px solid #dee2e6; display:flex; gap:8px; flex-shrink:0;">
                <input id="chat-input" type="text" class="form-control" placeholder="Stel een vraag…"
                    onkeydown="if(event.key==='Enter')sendMessage()">
                <button onclick="sendMessage()" class="btn btn-primary px-3">
                    <i class="bi bi-send-fill"></i>
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function sendMessage() {
    const input = document.getElementById('chat-input');
    const msg = input.value.trim();
    if (!msg) return;
    appendMessage(msg, 'user');
    input.value = '';
    const loadingEl = appendMessage('…', 'bot loading');
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 60000);
    try {
        const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg }),
            signal: controller.signal,
        });
        clearTimeout(timer);
        const json = await res.json();
        loadingEl.remove();
        appendMessage(res.ok ? json.reply : 'Fout: ' + (json.detail || res.status), 'bot');
    } catch (e) {
        clearTimeout(timer);
        loadingEl.remove();
        appendMessage(e.name === 'AbortError' ? 'Verzoek duurde te lang. Probeer opnieuw.' : 'Fout: ' + e.message, 'bot');
    }
}
function appendMessage(text, cls) {
    const msgs = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.className = 'chat-msg ' + cls;
    if (cls.includes('bot') && !cls.includes('loading')) {
        div.innerHTML = marked.parse(text);
    } else {
        div.textContent = text;
    }
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
}
</script>
{% endblock %}
