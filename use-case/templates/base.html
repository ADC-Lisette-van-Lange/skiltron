<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Schiphol Meldingen{% endblock %} — Gemeente Aalsmeer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --aalsmeer-blauw: #005b9e; }
        .navbar { background-color: var(--aalsmeer-blauw) !important; }
        .navbar-brand, .nav-link { color: #fff !important; }
        .nav-link:hover { color: #cce4f7 !important; }
        .nav-link.active { font-weight: 600; border-bottom: 2px solid #fff; }
        .gemeente-header { background: #f4f8fc; border-bottom: 3px solid var(--aalsmeer-blauw); padding: 0.6rem 0; }
        .badge-nieuw { background-color: #d63384; }
        .badge-behandeling { background-color: #fd7e14; }
        .badge-gesloten { background-color: #198754; }
        .badge-beantwoord { background-color: #0d6efd; }
        .badge-doorgezet { background-color: #6f42c1; }
        body { background: #f8f9fa; }
        .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        table { font-size: 0.9rem; }
        #chat-box { display: none; flex-direction: column; position: absolute; bottom: 68px; right: 0; width: 420px; height: 560px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.18); overflow: hidden; }
        #chat-box.open { display: flex; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { padding: 8px 12px; border-radius: 12px; max-width: 85%; font-size: 0.875rem; line-height: 1.4; word-wrap: break-word; }
        .chat-msg.user { background: var(--aalsmeer-blauw); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-msg.bot { background: #f0f4f8; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
        .chat-msg.loading { color: #999; font-style: italic; }
        .chat-msg.bot p { margin: 0 0 6px 0; }
        .chat-msg.bot p:last-child { margin-bottom: 0; }
        .chat-msg.bot ol, .chat-msg.bot ul { padding-left: 18px; margin: 4px 0; }
        .chat-msg.bot strong { font-weight: 600; }
    </style>
</head>
<body>
    <div class="gemeente-header">
        <div class="container d-flex align-items-center gap-2">
            <i class="bi bi-buildings fs-5 text-primary"></i>
            <span class="fw-semibold text-primary">Gemeente Aalsmeer</span>
        </div>
    </div>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <span class="navbar-brand fw-bold"><i class="bi bi-airplane me-2"></i>Schiphol Signalen</span>
            <div class="navbar-nav ms-auto">
                <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
                    <i class="bi bi-pencil-square me-1"></i>Melding indienen
                </a>
                <a class="nav-link {% if '/meldingen' in request.url.path %}active{% endif %}" href="/meldingen">
                    <i class="bi bi-list-ul me-1"></i>Meldingen
                </a>
                <a class="nav-link {% if '/dashboard' in request.url.path %}active{% endif %}" href="/dashboard">
                    <i class="bi bi-bar-chart-line me-1"></i>Dashboard
                </a>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
    {% block scripts %}{% endblock %}

    {% if '/dashboard' in request.url.path or '/meldingen' in request.url.path %}
    <div id="chat-widget" style="position:fixed;bottom:24px;right:24px;z-index:1050;">
        <div id="chat-box">
            <div style="background:var(--aalsmeer-blauw);color:#fff;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
                <span><i class="bi bi-robot me-2"></i>Data-assistent</span>
                <button onclick="toggleChat()" style="background:none;border:none;color:#fff;font-size:1rem;cursor:pointer;line-height:1;"><i class="bi bi-x-lg"></i></button>
            </div>
            <div id="chat-messages">
                <div class="chat-msg bot">Hallo! Stel een vraag over de meldingsdata.</div>
            </div>
            <div style="padding:10px;border-top:1px solid #e9ecef;display:flex;gap:8px;flex-shrink:0;">
                <input id="chat-input" type="text" placeholder="Stel een vraag..."
                    style="flex:1;border:1px solid #dee2e6;border-radius:6px;padding:6px 10px;font-size:0.875rem;outline:none;"
                    onkeydown="if(event.key==='Enter')sendMessage()">
                <button onclick="sendMessage()" style="background:var(--aalsmeer-blauw);border:none;color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;">
                    <i class="bi bi-send-fill"></i>
                </button>
            </div>
        </div>
        <button onclick="toggleChat()" style="display:block;margin-left:auto;width:52px;height:52px;border-radius:50%;background:var(--aalsmeer-blauw);border:none;color:#fff;font-size:1.3rem;box-shadow:0 2px 8px rgba(0,0,0,0.25);cursor:pointer;">
            <i class="bi bi-chat-dots-fill"></i>
        </button>
    </div>
    <script>
        function toggleChat() {
            document.getElementById('chat-box').classList.toggle('open');
        }
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;
            appendMessage(msg, 'user');
            input.value = '';
            const loadingEl = appendMessage('...', 'bot loading');
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 60000);
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg }),
                    signal: controller.signal,
                });
                clearTimeout(timer);
                const json = await res.json();
                loadingEl.remove();
                appendMessage(res.ok ? json.reply : 'Fout: ' + (json.detail || res.status), 'bot');
            } catch (e) {
                clearTimeout(timer);
                loadingEl.remove();
                appendMessage(e.name === 'AbortError' ? 'Verzoek duurde te lang. Probeer opnieuw.' : 'Er is een fout opgetreden: ' + e.message, 'bot');
            }
        }
        function appendMessage(text, cls) {
            const msgs = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'chat-msg ' + cls;
            if (cls.includes('bot') && !cls.includes('loading')) {
                div.innerHTML = marked.parse(text);
            } else {
                div.textContent = text;
            }
            msgs.appendChild(div);
            msgs.scrollTop = msgs.scrollHeight;
            return div;
        }
    </script>
    {% endif %}
</body>
</html>
