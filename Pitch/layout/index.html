<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Digitale Assistent — layout shell</title>
  <link rel="stylesheet" href="./layout.css"/>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Layout shell: logo, navbar, footer -->
  <script type="text/babel" src="./chrome.jsx"></script>

  <!-- App: thema-state + routing -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [theme, setTheme] = useState('light');
      const route = useRoute();

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
      }, [theme]);

      /* === VOEG HIER PAGINA-COMPONENTS TOE ===
         Voorbeeld:
           if (route === '/assistent') return <AssistentPage />;
      */
      let page = (
        <div className="container" style={{ paddingTop: 48 }}>
          <p style={{ color: 'var(--ink-500)' }}>Voeg hier je pagina-componenten toe.</p>
        </div>
      );

      return (
        <div className="app">
          <Brandbar />
          <Navbar route={route} theme={theme} setTheme={setTheme} />
          <main>{page}</main>
          <Footer />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
